packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
# Patch-level pins for transitive vulnerabilities with no parent upgrade
# path. Revisit on each Dependabot cycle; drop entries once parents move.
overrides:
  js-yaml@4.3.1: 4.3.2
  sharp@<0.35.5: 0.35.5
  source-map-js@<1.2.2: 1.2.2
  brace-expansion@1.1.18: 1.1.21
  brace-expansion@2.1.4: 2.1.7
  undici@>=7.0.0 <7.30.1: 7.30.1
  undici@>=8.0.0 <8.12.2: 8.12.3
  # Single @types/node keeps peer-resolved duplicates (e.g. dual vite
  # copies with clashing Plugin types) out of the tree.
  "@types/node@<26.6.4": 26.6.4
