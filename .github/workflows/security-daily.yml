name: Daily Security Checks

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Dependency Audit (npm + cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise toolchains & cache
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Initialize Monorepo Environment
        run: mise run init

      - name: Audit npm dependencies (high and above)
        run: node scripts/security-audit.mjs

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secrets:
    name: Verified Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan history for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          # The action already fails on findings: do not repeat its --fail flag.
          extra_args: --only-verified
