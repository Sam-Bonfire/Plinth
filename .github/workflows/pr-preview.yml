name: Preview Phase (PR Validation)

on:
  pull_request:
    branches: [ dev ]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ui_visual: ${{ steps.filter.outputs.ui_visual }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'packages/core-domain/**'
              - 'packages/sync-protocol/**'
              - 'apps/edge-api/**'
              - 'apps/pos-client/src-tauri/**'
              - '.github/workflows/pr-preview.yml'
            frontend:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'packages/ui-kit/**'
              - 'apps/pos-client/**'
              - '!apps/pos-client/src-tauri/**'
              - 'apps/web-dashboard/**'
              - 'apps/marketing-site/**'
              - '.github/workflows/pr-preview.yml'
            ui_visual:
              - 'packages/ui-kit/**'
              - 'apps/pos-client/**'
              - '!apps/pos-client/src-tauri/**'
              - 'apps/web-dashboard/**'
              - 'scripts/ui-capture.ts'
              - '.github/workflows/pr-preview.yml'

  backend-validation:
    name: Backend & Domain Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise toolchains & cache
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install Linux System Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libglib2.0-dev libsoup-3.0-dev libgtk-3-dev

      - name: Setup Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Cargo Clippy
        id: clippy
        run: mise run lint:rust

      - name: Run Cargo Tests
        id: cargo_tests
        run: mise run test:rust

      - name: Generate Backend Summary
        if: always()
        run: |
          echo "### 🦀 Backend & Domain Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo Clippy (Pedantic) | ${{ steps.clippy.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo Unit & Aggregate Tests | ${{ steps.cargo_tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  frontend-validation:
    name: Frontend Monorepo Validation
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise toolchains & cache
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Setup pnpm Store Cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Initialize Environment
        run: mise run init

      - name: Run ESLint
        id: eslint
        run: mise run lint:ts

      - name: Run TypeScript Checks & Specs
        id: ts_test
        run: mise run test:ts

      - name: Generate Frontend Summary
        if: always()
        run: |
          echo "### 🌐 Frontend Monorepo Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Strict Rules | ${{ steps.eslint.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Strict Typecheck & Specs | ${{ steps.ts_test.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  ui-snapshots:
    name: UI Visual Snapshots & Step Summary
    needs: detect-changes
    if: needs.detect-changes.outputs.ui_visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise toolchains & cache
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Setup pnpm Store Cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Initialize Environment
        run: mise run init

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: mise run ui:setup

      - name: Capture UI Snapshots Across Viewports
        id: capture
        run: mise run ui:capture

      - name: Publish Snapshots to Step Summary
        if: always()
        run: |
          if [ -f "artifacts/screenshots/summary.md" ]; then
            cat artifacts/screenshots/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload UI Screenshot Bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-snapshots-pr-${{ github.event.pull_request.number }}
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 3

      - name: Append Artifact Preview Links
        if: always()
        env:
          ARTIFACT_NAME: ui-snapshots-pr-${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=""
          for i in 1 2 3 4 5 6; do
            ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq ".artifacts[] | select(.name==\"$ARTIFACT_NAME\") | .id" | head -n 1)
            [ -n "$ARTIFACT_ID" ] && break
            sleep 10
          done
          if [ -z "$ARTIFACT_ID" ] || [ ! -f "artifacts/screenshots/manifest.json" ]; then
            echo "Snapshot artifact not found; skipping preview links." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/$ARTIFACT_ID" ARTIFACT_NAME="$ARTIFACT_NAME" node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("artifacts/screenshots/manifest.json", "utf8"));
            const url = process.env.ARTIFACT_URL;
            const name = process.env.ARTIFACT_NAME;
            const lines = ["", "---", "", "### Visual Previews", "", `Screenshots are bundled in the <a href="${url}">${name}</a> artifact (zip).`, ""];
            for (const s of manifest) {
              lines.push(`<details>`);
              lines.push(`  <summary><b>Preview: ${s.scene} (${s.viewport} - ${s.resolution})</b></summary>`);
              lines.push(`  <br />`);
              lines.push(`  <a href="${url}">${s.file}</a>`);
              lines.push(`</details>`);
              lines.push(``);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"), "utf8");
          '
