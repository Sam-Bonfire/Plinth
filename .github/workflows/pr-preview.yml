name: Preview Phase (PR Validation)

on:
  pull_request:
    branches: [ dev ]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  backend-validation:
    name: Backend & Domain Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Cargo Clippy
        id: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo Tests
        id: cargo_tests
        run: cargo test --workspace

      - name: Generate Backend Summary
        if: always()
        run: |
          echo "### 🦀 Backend & Domain Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo Clippy (Pedantic) | ${{ steps.clippy.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo Unit & Aggregate Tests | ${{ steps.cargo_tests.outcome == 'success' && '✅ Passed (53/53)' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  frontend-validation:
    name: Frontend Monorepo Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.22.0

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        id: eslint
        run: pnpm -r lint

      - name: Run TypeScript Checks & Specs
        id: ts_test
        run: pnpm -r test

      - name: Generate Frontend Summary
        if: always()
        run: |
          echo "### 🌐 Frontend Monorepo Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Strict Rules | ${{ steps.eslint.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Strict Typecheck | ${{ steps.ts_test.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  ui-snapshots:
    name: UI Visual Snapshots & Step Summary
    runs-on: ubuntu-latest
    # Only run when UI packages/apps or capture scripts are changed
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview:ui') ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.22.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Capture UI Snapshots Across Viewports
        id: capture
        run: pnpm tsx scripts/ui-capture.ts

      - name: Publish Snapshots to Step Summary
        if: always()
        run: |
          if [ -f "artifacts/screenshots/summary.md" ]; then
            cat artifacts/screenshots/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### 📸 UI Visual Verification: Skipped or No Diff" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload UI Screenshot Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots-pr-${{ github.event.pull_request.number }}
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 3
