name: Staging Pipeline (Dev Branch)

on:
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging-validation:
    name: Staging Full Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mise toolchains & cache
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Setup Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup pnpm Store Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Initialize Monorepo Environment
        run: mise run init

      - name: Monorepo Linting
        run: mise run lint

      - name: Monorepo Testing
        run: mise run test

      - name: Monorepo Production Build
        run: mise run build

      - name: Generate Staging Summary
        if: always()
        run: |
          echo "### 🚀 Staging Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "Dev branch is healthy and staging artifacts are validated." >> $GITHUB_STEP_SUMMARY
