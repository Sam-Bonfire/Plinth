name: Staging Pipeline (Dev Branch)

on:
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging-validation:
    name: Staging Monorepo Build & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mise toolchains & cache
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Setup Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup pnpm Store Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Initialize Monorepo Environment
        run: mise run init

      - name: Monorepo Linting
        run: mise run lint

      - name: Monorepo Testing
        run: mise run test

      - name: Monorepo Production Build
        run: mise run build

      - name: Upload Web Dashboard Bundle
        uses: actions/upload-artifact@v4
        with:
          name: staging-web-dashboard
          path: apps/web-dashboard/dist/
          retention-days: 7

      - name: Upload Marketing Site Bundle
        uses: actions/upload-artifact@v4
        with:
          name: staging-marketing-site
          path: apps/marketing-site/dist/
          retention-days: 7

      - name: Generate Staging Summary
        if: always()
        run: |
          echo "### 🚀 Staging Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "Dev branch is healthy and web/backend artifacts are validated." >> $GITHUB_STEP_SUMMARY

  staging-mobile-android:
    name: Staging Mobile Android APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup mise toolchains & cache
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup pnpm Store Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Android Rust Targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Initialize Environment
        run: mise run init

      - name: Initialize Android Template
        run: pnpm --filter pos-client exec tauri android init

      - name: Build Android APK
        run: pnpm --filter pos-client build:pos:android

      - name: Upload Android POS APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-pos-android-apk
          path: apps/pos-client/src-tauri/gen/android/app/build/outputs/apk/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate Android Step Summary
        if: always()
        run: |
          echo "### 📱 Android POS Client Build" >> $GITHUB_STEP_SUMMARY
          echo "Android APK compiled successfully for restaurant mobile hardware." >> $GITHUB_STEP_SUMMARY
