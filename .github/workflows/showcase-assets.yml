name: Device & Emulator Visual Showcase

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Device Platform Matrix'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android-emulator
          - ios-simulator
          - desktop-viewports

permissions:
  contents: read

jobs:
  desktop-viewports:
    name: Desktop POS & Tablet Viewports
    if: inputs.platform == 'all' || inputs.platform == 'desktop-viewports'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise toolchains & cache
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Setup pnpm Store Cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Initialize Environment
        run: mise run init

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: mise run ui:setup

      - name: Capture Viewports
        run: mise run ui:capture

      - name: Upload Desktop Screenshots
        uses: actions/upload-artifact@v6
        with:
          name: desktop-pos-screenshots
          path: artifacts/screenshots/
          retention-days: 14

  android-emulator:
    name: Native Android Emulator (KVM)
    if: inputs.platform == 'all' || inputs.platform == 'android-emulator'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator & Capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: Pixel_7_Pro_Plinth
          cores: 2
          ram-size: 2048M
          script: |
            pnpm --filter pos-client dev --port 5173 &
            sleep 5
            pnpm tsx scripts/emulator-capture.ts --platform=android

      - name: Upload Android Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-emulator-screenshots
          path: artifacts/screenshots/android-*.png
          retention-days: 14

  ios-simulator:
    name: Native iOS Simulator
    if: inputs.platform == 'all' || inputs.platform == 'ios-simulator'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot Simulator & Capture
        run: |
          pnpm --filter pos-client dev --port 5173 &
          sleep 5
          xcrun simctl boot "iPad Pro (13-inch) (M4)" || true
          pnpm tsx scripts/emulator-capture.ts --platform=ios

      - name: Upload iOS Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-screenshots
          path: artifacts/screenshots/ios-*.png
          retention-days: 14
