name: Production Validation (Main Branch)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main-validation:
    name: Production Baseline Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mise toolchains & cache
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Setup Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup pnpm Store Cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Initialize Monorepo Environment
        run: mise run init

      - name: Validate Production Build & Tests
        run: |
          mise run lint
          mise run test
          mise run build

      - name: Generate Summary
        if: always()
        run: |
          echo "### 🛡️ Production Main Branch Health" >> $GITHUB_STEP_SUMMARY
          echo "Main branch validation completed with zero warnings." >> $GITHUB_STEP_SUMMARY
