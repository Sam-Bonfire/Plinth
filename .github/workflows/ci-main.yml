name: Production Validation (Main Branch)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main-validation:
    name: Clean Production Baseline Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup mise toolchains (Clean Build - No Cache)
        uses: jdx/mise-action@v2
        with:
          cache: false

      - name: Install Linux System Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libglib2.0-dev libsoup-3.0-dev libgtk-3-dev

      - name: Initialize Monorepo Environment
        run: mise run init

      - name: Validate Production Build & Tests
        run: |
          mise run lint
          mise run test
          mise run build

      - name: Generate Summary
        if: always()
        run: |
          echo "### 🛡️ Production Main Branch Health" >> $GITHUB_STEP_SUMMARY
          echo "Clean production baseline validation completed with zero warnings without cache dependency." >> $GITHUB_STEP_SUMMARY
