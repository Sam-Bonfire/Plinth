[package]
name = "edge-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.5", features = ["d1"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
core-domain = { path = "../../packages/core-domain" }
rust_decimal.workspace = true
chrono = { workspace = true, features = ["serde", "wasmbind"] }
ed25519-dalek = "3.0.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto", "use_pem"] }
base64 = "0.23.1"
uuid = { workspace = true, features = ["serde", "v4", "v7", "js"] }

[lints]
workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3.77"
