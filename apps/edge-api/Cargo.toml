[package]
name = "edge-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.5", features = ["d1"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
core-domain = { path = "../../packages/core-domain" }
sync-protocol = { path = "../../packages/sync-protocol" }
rust_decimal.workspace = true
chrono = { workspace = true, features = ["serde", "wasmbind"] }
bincode.workspace = true
futures-util = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
ed25519-dalek = "3.0.0"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto", "use_pem"] }
include_dir = "0.7"
base64 = "0.23.1"
uuid = { workspace = true, features = ["serde", "v4", "v7", "js"] }
specta = { workspace = true }
specta-typescript = { workspace = true }

[[bin]]
name = "export_types"
path = "src/bin/export_types.rs"

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
wasm-bindgen-test = "0.3.77"
