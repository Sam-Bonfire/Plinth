[workspace]
resolver = "2"
members = [
    "packages/core-domain",
    "packages/sync-protocol",
    "apps/edge-api",
    "apps/pos-client/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Plinth Engineering Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.80"
rust_decimal = { version = "1.42.1", features = ["serde-with-str", "serde-bincode"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = "1.53.1"
uuid = { version = "1.24.1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bitflags = { version = "2.9", features = ["serde"] }
bincode = "1.3.3"
thiserror = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "warn"
clone_on_ref_ptr = "warn"
