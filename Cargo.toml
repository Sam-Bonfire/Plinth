[workspace]
resolver = "2"
members = [
    "packages/core-domain",
    "packages/sync-protocol",
    "apps/edge-api",
    "apps/pos-client/src-tauri"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Plinth Engineering Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rust_decimal = "1.42.1"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = "1.53.1"
uuid = "1.24.1"
bincode = "1.3.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "warn"
clone_on_ref_ptr = "warn"
