[tools]
node = "24.19.0"
pnpm = "11.22.0"
rust = "stable"
hurl = "8"
"cargo:tauri-cli" = "2.0.0"

[env]
CARGO_TERM_COLOR = "always"
PLINTH_ENV = "development"

[tasks."init"]
description = "Initialize git hooks and install monorepo dependencies"
run = "git config core.hooksPath .githooks && pnpm install"

[tasks."lint:rust"]
description = "Run Cargo clippy with pedantic warnings across Rust workspace"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:ts"]
description = "Run ESLint in parallel across TypeScript workspace"
run = "pnpm -r --parallel lint"

[tasks."lint"]
description = "Enforce Cargo clippy and ESLint strictly across monorepo"
run = "mise run lint:rust && mise run lint:ts"

[tasks."test:rust"]
description = "Execute all Rust workspace unit and integration tests"
run = "cargo test --workspace"

[tasks."test:ts"]
description = "Execute Vitest test suites in parallel across frontend packages"
run = "pnpm -r --parallel test"

[tasks."test"]
description = "Execute Rust unit tests, TypeScript specs, and API contract tests"
run = "mise run test:rust && mise run test:ts"

[tasks."test:api"]
description = "Execute declarative API integration tests using Hurl"
run = "hurl --test tests/api/**/*.hurl"

[tasks."db:migrate:local"]
description = "Apply D1 database migrations locally"
run = "pnpm --filter edge-api exec wrangler d1 migrations apply plinth_cellar --local"

[tasks."db:migrate:remote"]
description = "Apply D1 database migrations to remote production environment"
run = "pnpm --filter edge-api exec wrangler d1 migrations apply plinth_cellar --remote"

[tasks."build:rust"]
description = "Compile Rust crates across workspace"
run = "cargo build --workspace"

[tasks."build:ts"]
description = "Build TypeScript production packages in parallel"
run = "pnpm -r --parallel build"

[tasks."build"]
description = "Compile Rust binaries and bundle production packages"
run = "mise run build:rust && mise run build:ts"

[tasks."ui:setup"]
description = "Install Playwright browser binaries and dependencies"
run = "npx playwright install chromium --with-deps"

[tasks."ui:capture"]
description = "Generate visual verification UI screenshots across POS and Dashboard viewports"
run = "pnpm tsx scripts/ui-capture.ts"

[tasks."dev:pos"]
description = "Launch Tauri Native POS client in development mode"
run = "pnpm --filter pos-client dev"

[tasks."dev:web"]
description = "Launch Web Admin Dashboard"
run = "pnpm --filter web-dashboard dev"

[tasks."dev:site"]
description = "Launch Marketing Site"
run = "pnpm --filter marketing-site dev"
